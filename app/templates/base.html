<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Task Manager{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <header>

        <div class="header-content">

            <h1>Task Manager</h1>

            <p>Keep track of your tasks in one place.</p>

        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>Simple Task Manager</p>

    </footer>

</body>

</html>
