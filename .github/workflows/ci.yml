name: Build and Push Docker Image

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GitHub OIDC claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          export TOKEN

          python3 -c "
          import base64
          import json
          import os

          token = os.environ['TOKEN']

          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print('iss:', claims.get('iss'))
          print('aud:', claims.get('aud'))
          print('sub:', claims.get('sub'))
          print('job_workflow_ref:', claims.get('job_workflow_ref'))
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::228235827083:role/TaskManagerGitHubOIDCTestRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t task-manager .

      - name: Tag Docker image
        run: |
          docker tag task-manager:latest 228235827083.dkr.ecr.ap-south-1.amazonaws.com/task-manager:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push 228235827083.dkr.ecr.ap-south-1.amazonaws.com/task-manager:${{ github.sha }}