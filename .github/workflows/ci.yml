name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check OIDC Claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          python3 -c '
          import sys
          import base64
          import json

          token = sys.argv[1]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("iss:", claims.get("iss"))
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner:", claims.get("repository_owner"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("ref:", claims.get("ref"))
          print("event_name:", claims.get("event_name"))
          print("job_workflow_ref:", claims.get("job_workflow_ref"))
          ' "$TOKEN"

      - name: Check AWS-specific OIDC claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          python3 -c '
          import sys
          import base64
          import json

          token = sys.argv[1]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print(
              "https://aws.amazon.com/tags:",
              claims.get(
                  "https://aws.amazon.com/tags",
                  "NOT PRESENT"
              )
          )

          print(
              "https://aws.amazon.com/roles:",
              claims.get(
                  "https://aws.amazon.com/roles",
                  "NOT PRESENT"
              )
          )
          ' "$TOKEN"

      - name: Test AWS STS directly
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" > /tmp/github-oidc-token

          aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::228235827083:role/GitHubOIDCTestRole \
            --role-session-name github-actions-test \
            --web-identity-token file:///tmp/github-oidc-token \
            --duration-seconds 900 \
            --query 'AssumedRoleUser.Arn' \
            --output text

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::228235827083:role/GitHubOIDCTestRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t task-manager .

      - name: Tag Docker image
        run: |
          docker tag task-manager:latest \
            228235827083.dkr.ecr.ap-south-1.amazonaws.com/task-manager:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            228235827083.dkr.ecr.ap-south-1.amazonaws.com/task-manager:${{ github.sha }}