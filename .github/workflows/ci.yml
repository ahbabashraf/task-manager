name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t task-manager .

      - name: Tag Docker image
        run: |
          docker tag task-manager:latest \
          228235827083.dkr.ecr.ap-south-1.amazonaws.com/task-manager:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
          228235827083.dkr.ecr.ap-south-1.amazonaws.com/task-manager:${{ github.sha }}

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "i-019c17759788a9fec" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/task-manager",
              "export IMAGE_TAG=${{ github.sha }}",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 228235827083.dkr.ecr.ap-south-1.amazonaws.com",
              "docker compose -f docker-compose.ec2.yml pull web",
              "docker compose -f docker-compose.ec2.yml up -d web"
            ]' \
            --region ap-south-1